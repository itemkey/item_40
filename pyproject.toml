[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "item-40"
version = "0.3.0"
description = "Audio transcription for Windows."
requires-python = ">=3.12,<3.13"
dependencies = [
  "PySide6==6.10.1",
  "faster-whisper==1.2.1",
  "ctranslate2==4.6.2",
  "av==16.0.1",
  "huggingface-hub==0.36.0",
  "numpy>=2.2,<3",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "ruff>=0.14,<1", "pyinstaller>=6.16,<7"]

[project.scripts]
item-40 = "item40.__main__:main"

[tool.setuptools.packages.find]
include = ["item40*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
markers = ["integration: uses real models and takes time"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
