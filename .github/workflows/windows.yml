name: Windows
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.installer.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check item40 tests run.py
      - run: uv run pytest -m "not integration"
        env:
          QT_QPA_PLATFORM: offscreen
      - run: uv run python packaging/create_icon.py
        env:
          QT_QPA_PLATFORM: offscreen
      - run: uv run pyinstaller --noconfirm --clean packaging/item40.spec
      - name: Installer
        id: installer
        shell: pwsh
        run: |
          $version = uv run python -c "from item40 import __version__; print(__version__)"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Version and tag do not match.' }
          $compiler = @('C:\Program Files (x86)\Inno Setup 6\ISCC.exe', 'C:\Program Files\Inno Setup 7\ISCC.exe', 'C:\Program Files (x86)\Inno Setup 7\ISCC.exe') | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $compiler) { throw 'Inno Setup compiler is missing from this Windows image.' }
          & $compiler "/DAppVersion=$version" packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist/item-40 -DestinationPath "dist/item-40-$version-windows-x64-portable.zip"
          $assets = Get-ChildItem dist -File | Where-Object { $_.Name -like "item-40-$version-*" -and $_.Extension -in '.exe','.zip' }
          $assets | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: item-40-windows-x64
          path: |
            dist/*-setup.exe
            dist/*-portable.zip
            dist/SHA256SUMS.txt
  release:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ needs.build.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check release
        id: existing
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: v${{ needs.build.outputs.version }}
        with:
          script: |
            try {
              await github.rest.repos.getReleaseByTag({ ...context.repo, tag: process.env.RELEASE_TAG });
              core.setOutput('exists', 'true');
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput('exists', 'false');
            }
      - uses: actions/download-artifact@v4
        if: steps.existing.outputs.exists == 'false'
        with:
          name: item-40-windows-x64
          path: release
      - uses: softprops/action-gh-release@v2
        if: steps.existing.outputs.exists == 'false'
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: release/*
          name: item-40 v${{ needs.build.outputs.version }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
